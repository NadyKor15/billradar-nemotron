[project]
name = "billradar"
version = "0.1.0"
description = "Find missed hospital financial assistance and billing errors in a family's pile of medical bills."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "requests>=2.32",
    "pillow>=11.0",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pypdf>=5.1",
    "jinja2>=3.1",
    # the entry for AI agents (agent_entry.py): MCP spec 2026-07-28 and A2A protocol 1.0, pinned and audited 27.10
    "mcp==2.2.0",
    "a2a-sdk[http-server]==1.1.2",
    "reportlab>=4.2",
    # rapidocr-onnxruntime==1.4.4 is installed with --no-deps (it asks for opencv-python, we use the headless build):
    #   uv pip install --no-deps rapidocr-onnxruntime==1.4.4
    "onnxruntime>=1.19",
    "pyclipper>=1.3",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "six>=1.16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[project.scripts]
billradar = "billradar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["billradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["policy_text: needs policy PDFs downloaded by scripts/fetch_policies.py"]
